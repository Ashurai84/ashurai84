<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120">
  <defs>
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea">
        <animate attributeName="stop-color" values="#667eea;#764ba2;#f093fb;#667eea" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#f093fb">
        <animate attributeName="stop-color" values="#f093fb;#667eea;#764ba2;#f093fb" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="fGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
    .fbg { fill: #0a0a1a; }
    .ftext {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 13px;
      fill: #7070a0;
      letter-spacing: 1px;
    }
    .fname {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: url(#fGrad);
    }
    .fheart {
      animation: heartbeat 1.5s ease-in-out infinite;
      fill: #f093fb;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    .forb1 { animation: ffloat 6s ease-in-out infinite; }
    .forb2 { animation: ffloat 8s ease-in-out infinite reverse; }
    @keyframes ffloat {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.25; }
    }
  </style>
  <rect class="fbg" width="900" height="120" rx="12"/>
  <circle class="forb1" cx="100" cy="60" r="60" fill="#667eea" opacity="0.1" filter="url(#fGlow)"/>
  <circle class="forb2" cx="800" cy="60" r="50" fill="#f093fb" opacity="0.08" filter="url(#fGlow)"/>
  <rect x="250" y="30" width="400" height="1" rx="0.5" fill="url(#fGrad)" opacity="0.3"/>
  <text class="ftext" x="450" y="60" text-anchor="middle">"Talk is cheap. Show me the code." — Linus Torvalds</text>
  <g transform="translate(450, 85)" text-anchor="middle">
    <text class="ftext" x="-30" y="0">Made with</text>
    <text class="fheart" x="8" y="0" style="transform-origin: 8px 0px;">♥</text>
    <text class="ftext" x="18" y="0">by</text>
    <text class="fname" x="62" y="0">Ashutosh</text>
  </g>
  <rect x="250" y="102" width="400" height="1" rx="0.5" fill="url(#fGrad)" opacity="0.3"/>
</svg>
