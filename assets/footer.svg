<svg xmlns="http://www.w3.org/2000/svg" width="950" height="120" viewBox="0 0 950 120" fill="none">
  <defs>
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#EC4899;#06B6D4;#8B5CF6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899;#06B6D4;#8B5CF6;#EC4899" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .ftext {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 13px;
      fill: #8E8EA8;
      letter-spacing: 0.8px;
    }
    .fname {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: url(#fGrad);
      letter-spacing: 1px;
    }
    .fheart {
      fill: #EC4899;
    }
  </style>

  <rect width="950" height="120" rx="16" fill="#0A0A16" stroke="#1E1E38" stroke-width="1"/>
  <circle cx="120" cy="60" r="50" fill="#8B5CF6" opacity="0.12" filter="url(#fGlow)"/>
  <circle cx="830" cy="60" r="50" fill="#EC4899" opacity="0.1" filter="url(#fGlow)"/>

  <!-- Top hairline -->
  <line x1="250" y1="28" x2="700" y2="28" stroke="url(#fGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Quote -->
  <text class="ftext" x="475" y="58" text-anchor="middle">"Talk is cheap. Show me the code." — Linus Torvalds</text>

  <!-- Crafted text -->
  <g transform="translate(475, 84)" text-anchor="middle">
    <text class="ftext" x="-45" y="0">Designed &amp; Built with</text>
    <text class="fheart" x="32" y="0">♥</text>
    <text class="ftext" x="48" y="0">by</text>
    <text class="fname" x="88" y="0">Ashutosh</text>
  </g>

  <!-- Bottom hairline -->
  <line x1="250" y1="102" x2="700" y2="102" stroke="url(#fGrad)" stroke-width="1" opacity="0.3"/>
</svg>
