<svg xmlns="http://www.w3.org/2000/svg" width="950" height="165" viewBox="0 0 950 165" fill="none">
  <defs>
    <!-- Dynamic Animated Neon Gradient -->
    <linearGradient id="sigGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#EC4899;#06B6D4;#3B82F6;#8B5CF6" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899;#06B6D4;#3B82F6;#8B5CF6;#EC4899" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#3B82F6;#8B5CF6;#EC4899;#06B6D4" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="hairlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="25%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#EC4899;#06B6D4;#8B5CF6;#EC4899" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="cornerGlowL" cx="15%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cornerGlowR" cx="85%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <filter id="sigGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-base {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .motto-text {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 2px;
      fill: #CBD5E1;
      text-transform: uppercase;
    }
    .signature-name {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 5px;
      fill: url(#sigGrad);
      filter: url(#sigGlow);
    }
    .creds-text {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      fill: #94A3B8;
      text-transform: uppercase;
    }
    .philosophy-quote {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.8px;
      fill: #64748B;
      font-style: italic;
    }
    .sparkle-dot {
      fill: #EC4899;
      opacity: 0.7;
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="946" height="161" rx="18" fill="#0A0A16" stroke="#232342" stroke-width="1.2"/>

  <!-- Ambient Glows -->
  <rect x="2" y="2" width="946" height="161" rx="18" fill="url(#cornerGlowL)"/>
  <rect x="2" y="2" width="946" height="161" rx="18" fill="url(#cornerGlowR)"/>

  <!-- Top Decorative Divider -->
  <line x1="120" y1="24" x2="830" y2="24" stroke="url(#hairlineGrad)" stroke-width="1.2"/>
  <circle cx="475" cy="24" r="3" fill="#EC4899">
    <animate attributeName="fill" values="#EC4899;#06B6D4;#8B5CF6;#EC4899" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Engineering Motto -->
  <text class="font-base motto-text" x="475" y="52" text-anchor="middle">Driven by curiosity  ✦  Engineered with precision</text>

  <!-- Prominent Signature -->
  <text class="font-base signature-name" x="475" y="94" text-anchor="middle">ASHUTOSH RAI</text>

  <!-- Credentials Sub-bar -->
  <text class="font-base creds-text" x="475" y="118" text-anchor="middle">Full-Stack Engineer  ·  AI Systems Architect  ·  Builder</text>

  <!-- Subtle Bottom Philosophy -->
  <line x1="260" y1="134" x2="690" y2="134" stroke="url(#hairlineGrad)" stroke-width="0.8"/>
  <text class="font-base philosophy-quote" x="475" y="150" text-anchor="middle">"Crafting systems at the intersection of intelligence, elegance, and scale."</text>

  <!-- Accent Sparkles -->
  <circle cx="280" cy="90" r="1.5" class="sparkle-dot"/>
  <circle cx="670" cy="90" r="1.5" class="sparkle-dot"/>
</svg>
