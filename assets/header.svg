<svg xmlns="http://www.w3.org/2000/svg" width="950" height="340" viewBox="0 0 950 340" fill="none">
  <defs>
    <!-- Dynamic Animated Gradients -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#EC4899;#06B6D4;#3B82F6;#8B5CF6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899;#06B6D4;#3B82F6;#8B5CF6;#EC4899" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#3B82F6;#8B5CF6;#EC4899;#06B6D4" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.15"/>
    </linearGradient>

    <radialGradient id="meshGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshGlow3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-base {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .title-name {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 6px;
      fill: url(#neonGrad);
      filter: url(#softGlow);
    }
    .terminal-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      fill: #8E8EA8;
    }
    .role-badge-text {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #E2E8F0;
    }
    .tagline-text {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      fill: #94A3B8;
    }
    .pill-text {
      font-size: 12px;
      font-weight: 600;
      fill: #CBD5E1;
      letter-spacing: 0.8px;
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    .pulsing-orb {
      animation: pulseOrb 4s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="946" height="336" rx="20" fill="#0A0A16" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Ambient Ambient Glows -->
  <rect x="2" y="2" width="946" height="336" rx="20" fill="url(#meshGlow1)"/>
  <rect x="2" y="2" width="946" height="336" rx="20" fill="url(#meshGlow2)"/>
  <rect x="2" y="2" width="946" height="336" rx="20" fill="url(#meshGlow3)"/>

  <!-- Subtle Modern Tech Grid -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="0.8">
    <line x1="0" y1="50" x2="950" y2="50"/>
    <line x1="0" y1="100" x2="950" y2="100"/>
    <line x1="0" y1="150" x2="950" y2="150"/>
    <line x1="0" y1="200" x2="950" y2="200"/>
    <line x1="0" y1="250" x2="950" y2="250"/>
    <line x1="0" y1="290" x2="950" y2="290"/>
    <line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="240" y1="0" x2="240" y2="340"/>
    <line x1="360" y1="0" x2="360" y2="340"/>
    <line x1="480" y1="0" x2="480" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="720" y1="0" x2="720" y2="340"/>
    <line x1="840" y1="0" x2="840" y2="340"/>
  </g>

  <!-- Terminal Window Bar -->
  <rect x="2" y="2" width="946" height="42" rx="20" fill="#0F0F24" opacity="0.8"/>
  <rect x="2" y="24" width="946" height="20" fill="#0F0F24" opacity="0.8"/>
  <line x1="2" y1="44" x2="948" y2="44" stroke="#1E1E38" stroke-width="1"/>

  <!-- Traffic Lights -->
  <circle cx="30" cy="23" r="6" fill="#FF5F56"/>
  <circle cx="48" cy="23" r="6" fill="#FFBD2E"/>
  <circle cx="66" cy="23" r="6" fill="#27C93F"/>

  <!-- Terminal Title Center -->
  <text class="font-base terminal-title" x="475" y="27" text-anchor="middle">ashutosh@architect: ~/portfolio</text>

  <!-- Status Ping Indicator Right -->
  <circle cx="905" cy="23" r="4" fill="#10B981">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text class="font-base" x="892" y="27" text-anchor="end" fill="#10B981" font-size="11" font-weight="600" letter-spacing="1">ONLINE</text>

  <!-- Main Hero Name -->
  <text class="font-base title-name" x="475" y="130" text-anchor="middle">ASHUTOSH RAI</text>

  <!-- Subtitle Tagline with Badges -->
  <g transform="translate(475, 172)" text-anchor="middle">
    <!-- Center Pill Badge -->
    <rect x="-240" y="-16" width="480" height="32" rx="16" fill="url(#badgeGrad)" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1"/>
    <text class="font-base role-badge-text" x="0" y="5">FULL-STACK ENGINEER  ✦  AI ARCHITECT</text>
  </g>

  <!-- Tagline Quote -->
  <text class="font-base tagline-text" x="475" y="228" text-anchor="middle">Architecting next-generation autonomous AI systems &amp; production web apps</text>

  <!-- Highlight Stat Pills (Bottom Bar) -->
  <g transform="translate(145, 268)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="195" height="36" rx="18" fill="#13132B" stroke="#2A2A4E" stroke-width="1"/>
      <circle cx="22" cy="18" r="4" fill="#8B5CF6"/>
      <text class="font-base pill-text" x="38" y="22">⚡ 120+ Public Repos</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(235, 0)">
      <rect x="0" y="0" width="195" height="36" rx="18" fill="#13132B" stroke="#2A2A4E" stroke-width="1"/>
      <circle cx="22" cy="18" r="4" fill="#EC4899"/>
      <text class="font-base pill-text" x="38" y="22">🔥 218+ Days Active</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(470, 0)">
      <rect x="0" y="0" width="195" height="36" rx="18" fill="#13132B" stroke="#2A2A4E" stroke-width="1"/>
      <circle cx="22" cy="18" r="4" fill="#06B6D4"/>
      <text class="font-base pill-text" x="38" y="22">🧠 Neural AI &amp; Voice</text>
    </g>
  </g>

  <!-- Subtle Corner Accents -->
  <circle cx="100" cy="120" r="2" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="850" cy="140" r="2" fill="#EC4899" opacity="0.6"/>
  <circle cx="130" cy="220" r="2.5" fill="#06B6D4" opacity="0.5"/>
  <circle cx="820" cy="230" r="2" fill="#8B5CF6" opacity="0.5"/>
</svg>
